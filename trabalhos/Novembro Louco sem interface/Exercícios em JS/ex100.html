<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Espaços em Branco</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        textarea, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
            height: 100px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            width: 300px;
            min-height: 50px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <h1>Remover Espaços em Branco</h1>
    <textarea id="texto" placeholder="Digite o texto aqui..."></textarea>
    <button onclick="removerEspacos()">Remover Espaços</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        function removerEspacos() {
            let texto = document.querySelector("#texto").value
            let textoSemEspacos = texto.replaceAll(' ', '')

            let resultado = document.querySelector("#resultado")
            resultado.textContent = textoSemEspacos
        }
    </script>
</body>
</html>
