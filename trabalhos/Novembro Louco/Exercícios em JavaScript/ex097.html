<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de Números</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Insira 15 Números</h1>
    <input type="text" id="numeros" placeholder="Digite os números separados por vírgula">
    <button onclick="calcularSoma()">Calcular Soma</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        function calcularSoma() {
            let input = document.querySelector("#numeros").value
            let numeros = input.split(",").map(num => parseFloat(num.trim()))
            let soma = numeros.reduce((acc, num) => acc + num, 0)

            let resultado = document.querySelector("#resultado")
            if (numeros.length === 15) {
                resultado.textContent = `A soma dos números é: ${soma}`
            } else {
                resultado.textContent = "Por favor, insira exatamente 15 números."
            }
        }
    </script>
</body>
</html>
