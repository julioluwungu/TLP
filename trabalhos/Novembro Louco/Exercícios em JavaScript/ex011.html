<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Amigáveis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Números Amigáveis</h1>
    
    <div class="instruction">Clique no botão para encontrar pares de números amigáveis até 10000:</div>
    
    <button id="encontrar-btn">Encontrar Pares Amigáveis</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#encontrar-btn').addEventListener('click', function() {
            function somaDivisores(n) {
                let soma = 0
                for (let i = 1; i <= n / 2; i++) {
                    if (n % i === 0) {
                        soma += i
                    }
                }
                return soma
            }

            function encontrarNumerosAmigaveis(limite) {
                let paresAmigaveis = []
                
                for (let a = 1; a < limite; a++) {
                    let b = somaDivisores(a)
                    if (b > a && b < limite && somaDivisores(b) === a) {
                        paresAmigaveis.push([a, b])
                    }
                }
                
                return paresAmigaveis
            }

            const limite = 10000
            const paresAmigaveis = encontrarNumerosAmigaveis(limite)
            
            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">Pares de números amigáveis entre 1 e 10000:</div>
                <div>${paresAmigaveis.map(par => `(${par[0]}, ${par[1]})`).join(', ')}</div>
            `
        })
    </script>
</body>
</html>
