<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciais do Nome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Iniciais do Nome</h1>
    
    <div class="instruction">Digite o seu nome completo:</div>
    
    <input type="text" id="nome-input" placeholder="Digite seu nome completo">
    
    <button id="extrair-btn">Extrair Iniciais</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#extrair-btn').addEventListener('click', function() {
            const nomeInput = document.querySelector('#nome-input')
            const resultado = document.querySelector('#resultado')
            const nome = nomeInput.value.trim()

            if (!nome) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um nome!</span>'
                nomeInput.focus()
                return
            }

            let conectores = ['e', 'do', 'da', 'dos', 'das', 'de', 'di', 'du']
            let palavras = nome.split(' ')

            let iniciais = palavras.reduce((acc, palavra) => {
                if (!conectores.includes(palavra.toLowerCase())) {
                    acc.push(palavra[0].toUpperCase())
                }
                return acc
            }, [])

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">As iniciais são: ${iniciais.join(', ')}</span>`

            nomeInput.value = ''
            nomeInput.focus()
        })

        document.querySelector('#nome-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#extrair-btn').click()
            }
        })
    </script>
</body>
</html>
