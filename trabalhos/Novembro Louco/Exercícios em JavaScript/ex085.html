<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetidor de Palavras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Repetidor de Palavras</h1>
    
    <div class="instruction">Digite uma frase:</div>
    
    <input type="text" id="frase-input" placeholder="Digite uma frase">
    
    <button id="repetir-btn">Repetir Palavras</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#repetir-btn').addEventListener('click', function() {
            const fraseInput = document.querySelector('#frase-input')
            const resultado = document.querySelector('#resultado')
            const frase = fraseInput.value.trim()

            if (!frase) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite uma frase!</span>'
                fraseInput.focus()
                return
            }

            let fraseRepetida = frase.split(' ').map(palavra => `${palavra} ${palavra}`).join(' ')

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">Saída: ${fraseRepetida}</span>`

            fraseInput.value = ''
            fraseInput.focus()
        })

        document.querySelector('#frase-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#repetir-btn').click()
            }
        })
    </script>
</body>
</html>
