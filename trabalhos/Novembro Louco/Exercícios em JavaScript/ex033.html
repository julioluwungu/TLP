<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Módulo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Módulo</h1>
    
    <div class="instruction" id="instruction">Deseja qual variação do código? (1, 3 ou 4):</div>
    
    <select id="variacao-input">
        <option value="">Selecione uma opção</option>
        <option value="1">Variação 1 - 10 cálculos</option>
        <option value="3">Variação 3 - 100 cálculos</option>
        <option value="4">Variação 4 - N cálculos</option>
    </select>
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let variacao
        let etapa = 0
        let calculosFeitos = 0
        let totalCalculos = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const variacaoInput = document.querySelector('#variacao-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                variacao = variacaoInput.value
                
                if (!variacao) {
                    resultado.innerHTML = '<span style="color: red;">Opção inválida! Por favor, tente novamente.</span>'
                    return
                }
                
                if (variacao === '2') {
                    resultado.innerHTML = '<span style="color: red;">Nenhum código disponível para esta opção.</span>'
                    return
                }
                
                etapa = 1
                variacaoInput.style.display = 'none'
                
                if (variacao === '1') {
                    totalCalculos = 10
                    instruction.textContent = 'Informe o valor de A:'
                } else if (variacao === '3') {
                    totalCalculos = 100
                    instruction.textContent = 'Informe o valor de A:'
                } else if (variacao === '4') {
                    instruction.textContent = 'Informe quantas vezes deseja executar:'
                }
                
                const input = document.createElement('input')
                input.type = 'number'
                input.id = 'valor-input'
                input.step = 'any'
                document.body.insertBefore(input, document.querySelector('#proximo-btn'))
                
                resultado.innerHTML = ''
                
            } else if (etapa === 1) {
                const valorInput = document.querySelector('#valor-input')
                
                if (variacao === '4') {
                    const numN = parseInt(valorInput.value)
                    
                    if (isNaN(numN) || numN <= 0) {
                        resultado.innerHTML = '<span style="color: red;">Valor inválido!</span>'
                        valorInput.value = ''
                        valorInput.focus()
                        return
                    }
                    
                    totalCalculos = numN
                    etapa = 2
                    instruction.textContent = 'Informe o valor de A:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                etapa = 2
                instruction.textContent = 'Informe o valor de A:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 2) {
                const valorInput = document.querySelector('#valor-input')
                const numA = parseFloat(valorInput.value)
                
                if (isNaN(numA)) {
                    resultado.innerHTML = '<span style="color: red;">Valor inválido!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                etapa = 3
                instruction.textContent = 'Informe o valor de B:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 3) {
                const valorInput = document.querySelector('#valor-input')
                const numB = parseFloat(valorInput.value)
                
                if (isNaN(numB)) {
                    resultado.innerHTML = '<span style="color: red;">Valor inválido!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                if (numB === 0) {
                    resultado.innerHTML = '<span style="color: red;">Divisão por zero não é permitida, tente novamente.</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                let modulo = numA % numB
                calculosFeitos++
                
                resultado.innerHTML = `<span style="color: green;">O resultado do módulo é: ${modulo}</span>`
                
                if (calculosFeitos < totalCalculos) {
                    instruction.textContent = 'Informe o valor de A:'
                    valorInput.value = ''
                    valorInput.focus()
                    etapa = 2
                } else {
                    resultado.innerHTML += `<div style="margin-top: 10px; color: blue; font-weight: bold;">Todos os ${totalCalculos} cálculos foram concluídos!</div>`
                    
                    document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                    document.querySelector('#proximo-btn').addEventListener('click', function() {
                        location.reload()
                    }, { once: true })
                }
            }
        })

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
