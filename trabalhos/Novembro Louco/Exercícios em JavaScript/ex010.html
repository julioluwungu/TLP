<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Média</h1>
    
    <div class="instruction" id="instruction">Digite o 1º valor (negativo para parar):</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número" step="any">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let valores = []
        let contador = 1
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const num = parseInt(valorInput.value)
            
            if (isNaN(num)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido!</span>'
                valorInput.value = ''
                valorInput.focus()
                return
            }
            
            if (num > 0) {
                valores.push(num)
                contador++
                instruction.textContent = `Digite o ${contador}º valor (negativo para parar):`
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
            } else if (num < 0) {
                if (valores.length === 0) {
                    resultado.innerHTML = '<span style="color: red;">Nenhum valor positivo foi digitado!</span>'
                    return
                }
                
                let soma = valores.reduce((ac, valor) => ac + valor)
                let media = soma / valores.length
                
                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">A média é de ${media.toFixed(1)}</span>`
                
                document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    valores = []
                    contador = 1
                    instruction.textContent = 'Digite o 1º valor (negativo para parar):'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
