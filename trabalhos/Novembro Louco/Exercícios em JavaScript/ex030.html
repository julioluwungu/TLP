<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Pares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Números Pares</h1>
    
    <div class="instruction">Clique no botão para ver os números pares entre 85 e 31:</div>
    
    <button id="mostrar-btn">Mostrar Números Pares</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#mostrar-btn').addEventListener('click', function() {
            let soma = 0
            let pares = []

            for (let num = 85; num >= 31; num--) {
                if (num % 2 === 0) {
                    pares.push(num)
                    soma += num
                }
            }

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">Os números pares compreendidos entre 85 e 31 são:</div>
                <div style="margin-bottom: 10px;">${pares.join(', ')}</div>
                <div style="color: blue; font-weight: bold;">E a sua soma deu: ${soma}</div>
            `
        })
    </script>
</body>
</html>
