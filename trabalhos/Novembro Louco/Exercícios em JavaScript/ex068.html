<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador de Palavra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Localizador de Palavra</h1>
    
    <div class="instruction" id="instruction">Digite uma frase qualquer:</div>
    
    <input type="text" id="valor-input" placeholder="Digite uma frase">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let frase
        let etapa = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                frase = valorInput.value.trim()
                
                if (!frase) {
                    resultado.innerHTML = '<span style="color: red;">Por favor, digite uma frase!</span>'
                    valorInput.focus()
                    return
                }
                
                etapa = 1
                instruction.textContent = 'Digite uma palavra que exista na frase:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 1) {
                const palavra = valorInput.value.trim()
                
                if (!palavra) {
                    resultado.innerHTML = '<span style="color: red;">Por favor, digite uma palavra!</span>'
                    valorInput.focus()
                    return
                }
                
                if (!frase.includes(palavra)) {
                    resultado.innerHTML = '<span style="color: red;">Digite uma palavra que exista na frase!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                let vetorFrase = frase.split(' ')
                let indice = vetorFrase.indexOf(palavra)

                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">A palavra "${palavra}" encontra-se com o índice ${indice}</span>`
                
                document.querySelector('#proximo-btn').textContent = 'Verificar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    etapa = 0
                    instruction.textContent = 'Digite uma frase qualquer:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
