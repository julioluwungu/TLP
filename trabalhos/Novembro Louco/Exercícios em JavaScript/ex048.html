<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressão Geométrica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Progressão Geométrica</h1>
    
    <div class="instruction">Clique no botão para calcular a PG de primeiro termo 3 e razão 3:</div>
    
    <button id="calcular-btn">Calcular PG</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            let primeiroTermo = 3
            let razao = 3
            let termos = []
            let termoAtual = primeiroTermo
            let soma = 0

            while (termoAtual <= 6561) {
                termos.push(termoAtual)
                soma += termoAtual
                termoAtual *= razao
            }

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">Termos da PG: ${termos.join(', ')}</div>
                <div style="color: blue; font-weight: bold;">Soma dos termos: ${soma}</div>
            `
        })
    </script>
</body>
</html>
