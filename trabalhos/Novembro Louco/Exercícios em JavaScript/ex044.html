<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisão por Subtração</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Divisão por Subtração</h1>
    
    <div class="instruction" id="instruction">Digite o primeiro número inteiro positivo:</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número positivo" min="1">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let numero1
        let numero2
        let etapa = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                numero1 = parseInt(valorInput.value)
                
                if (isNaN(numero1) || numero1 <= 0) {
                    resultado.innerHTML = '<span style="color: red;">Entrada inválida! Por favor, digite um número inteiro válido.</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                etapa = 1
                instruction.textContent = 'Digite o segundo número inteiro positivo:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 1) {
                numero2 = parseInt(valorInput.value)
                
                if (isNaN(numero2) || numero2 <= 0) {
                    resultado.innerHTML = '<span style="color: red;">Entrada inválida! Por favor, digite um número inteiro válido.</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                let quociente = 0
                let resto = numero1

                while (resto >= numero2) {
                    resto -= numero2
                    quociente++
                }

                resultado.innerHTML = `
                    <div style="color: blue; font-weight: bold;">Quociente: ${quociente}</div>
                    <div style="color: blue; font-weight: bold;">Resto: ${resto}</div>
                `
                
                document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    etapa = 0
                    instruction.textContent = 'Digite o primeiro número inteiro positivo:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
