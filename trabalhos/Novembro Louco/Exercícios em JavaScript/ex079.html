<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palíndromas Mútuas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Palíndromas Mútuas</h1>
    
    <div class="instruction" id="instruction">Digite a primeira string:</div>
    
    <input type="text" id="valor-input" placeholder="Digite uma string">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let string1
        let etapa = 0
        
        function palindromasMutuas(str1, str2) {
            let str2Reversa = str2.split('').reverse().join('')
            return str1 === str2Reversa
        }

        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                string1 = valorInput.value.trim()
                
                if (!string1) {
                    resultado.innerHTML = '<span style="color: red;">Por favor, digite uma string!</span>'
                    valorInput.focus()
                    return
                }
                
                etapa = 1
                instruction.textContent = 'Digite a segunda string:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 1) {
                const string2 = valorInput.value.trim()
                
                if (!string2) {
                    resultado.innerHTML = '<span style="color: red;">Por favor, digite uma string!</span>'
                    valorInput.focus()
                    return
                }
                
                let resultadoFinal = palindromasMutuas(string1, string2)
                
                if (resultadoFinal) {
                    resultado.innerHTML = `<span style="color: green; font-weight: bold;">As strings "${string1}" e "${string2}" são palíndromas mútuas.</span>`
                } else {
                    resultado.innerHTML = `<span style="color: red; font-weight: bold;">As strings "${string1}" e "${string2}" não são palíndromas mútuas.</span>`
                }
                
                document.querySelector('#proximo-btn').textContent = 'Verificar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    etapa = 0
                    instruction.textContent = 'Digite a primeira string:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
