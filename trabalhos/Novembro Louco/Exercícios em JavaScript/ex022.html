<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maior Elemento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Maior Elemento</h1>
    
    <div class="instruction" id="instruction">Digite o 1º valor (positivo):</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número positivo" min="0.0001" step="any">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let numQ = []
        let valorAtual = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const num = parseFloat(valorInput.value)
            
            if (isNaN(num) || num <= 0) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número positivo.</span>'
                valorInput.value = ''
                valorInput.focus()
                return
            }
            
            numQ.push(num)
            valorAtual++
            
            if (valorAtual < 20) {
                instruction.textContent = `Digite o ${valorAtual + 1}º valor (positivo):`
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
            } else {
                let maiorElemento = numQ[0]
                let posicao = 0

                for (let i = 1; i < numQ.length; i++) {
                    if (numQ[i] > maiorElemento) {
                        maiorElemento = numQ[i]
                        posicao = i
                    }
                }

                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O maior elemento é ${maiorElemento} e ocupa a posição ${posicao + 1} no vetor.</span>`
                
                document.querySelector('#proximo-btn').textContent = 'Verificar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    numQ = []
                    valorAtual = 0
                    instruction.textContent = 'Digite o 1º valor (positivo):'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
