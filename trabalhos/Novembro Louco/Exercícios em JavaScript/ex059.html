<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Habitantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Pesquisa de Habitantes</h1>
    
    <div class="instruction" id="instruction">Informe a idade (ou -1 para encerrar):</div>
    
    <input type="number" id="valor-input" placeholder="Digite a idade">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let maiorIdade = -1
        let qtdMulheres18_35 = 0
        let qtdVerdeLouros = 0
        let etapa = 0
        let idadeAtual
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                const idade = parseInt(valorInput.value)
                
                if (idade === -1) {
                    if (maiorIdade === -1) {
                        resultado.innerHTML = '<span style="color: red;">Nenhum habitante foi cadastrado!</span>'
                        return
                    }
                    
                    resultado.innerHTML = `
                        <div style="color: blue; font-weight: bold;">A maior idade dos habitantes é: ${maiorIdade}</div>
                        <div style="color: blue; font-weight: bold;">Quantidade de mulheres entre 18 e 35 anos: ${qtdMulheres18_35}</div>
                        <div style="color: blue; font-weight: bold;">Quantidade de indivíduos com olhos verdes e cabelos louros: ${qtdVerdeLouros}</div>
                    `
                    
                    document.querySelector('#proximo-btn').textContent = 'Pesquisar Novamente'
                    document.querySelector('#proximo-btn').addEventListener('click', function() {
                        maiorIdade = -1
                        qtdMulheres18_35 = 0
                        qtdVerdeLouros = 0
                        etapa = 0
                        instruction.textContent = 'Informe a idade (ou -1 para encerrar):'
                        resultado.innerHTML = ''
                        valorInput.value = ''
                        valorInput.focus()
                        this.textContent = 'Próximo'
                    }, { once: true })
                    return
                }
                
                if (isNaN(idade) || idade < -1) {
                    resultado.innerHTML = '<span style="color: red;">Idade inválida!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                idadeAtual = idade
                etapa = 1
                instruction.textContent = 'Informe o sexo (M/F):'
                resultado.innerHTML = ''
                
                valorInput.style.display = 'none'
                const select = document.createElement('select')
                select.id = 'sexo-select'
                select.innerHTML = `
                    <option value="">Selecione o sexo</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                `
                document.body.insertBefore(select, document.querySelector('#proximo-btn'))
                
            } else if (etapa === 1) {
                const sexoSelect = document.querySelector('#sexo-select')
                const sexo = sexoSelect.value.toUpperCase()
                
                if (!sexo) {
                    resultado.innerHTML = '<span style="color: red;">Selecione o sexo!</span>'
                    return
                }
                
                etapa = 2
                instruction.textContent = 'Informe a cor dos olhos:'
                resultado.innerHTML = ''
                
                sexoSelect.remove()
                
                const selectOlhos = document.createElement('select')
                selectOlhos.id = 'olhos-select'
                selectOlhos.innerHTML = `
                    <option value="">Selecione a cor dos olhos</option>
                    <option value="1">Azuis</option>
                    <option value="2">Verdes</option>
                    <option value="3">Castanhos</option>
                `
                document.body.insertBefore(selectOlhos, document.querySelector('#proximo-btn'))
                
            } else if (etapa === 2) {
                const olhosSelect = document.querySelector('#olhos-select')
                const corOlhos = parseInt(olhosSelect.value)
                
                if (isNaN(corOlhos)) {
                    resultado.innerHTML = '<span style="color: red;">Selecione a cor dos olhos!</span>'
                    return
                }
                
                etapa = 3
                instruction.textContent = 'Informe a cor dos cabelos:'
                resultado.innerHTML = ''
                
                olhosSelect.remove()
                
                const selectCabelos = document.createElement('select')
                selectCabelos.id = 'cabelos-select'
                selectCabelos.innerHTML = `
                    <option value="">Selecione a cor dos cabelos</option>
                    <option value="1">Loiro</option>
                    <option value="2">Castanho</option>
                    <option value="3">Preto</option>
                `
                document.body.insertBefore(selectCabelos, document.querySelector('#proximo-btn'))
                
            } else if (etapa === 3) {
                const cabelosSelect = document.querySelector('#cabelos-select')
                const corCabelos = parseInt(cabelosSelect.value)
                
                if (isNaN(corCabelos)) {
                    resultado.innerHTML = '<span style="color: red;">Selecione a cor dos cabelos!</span>'
                    return
                }
                
                if (idadeAtual > maiorIdade) {
                    maiorIdade = idadeAtual
                }

                if (sexo === 'F' && idadeAtual >= 18 && idadeAtual <= 35) {
                    qtdMulheres18_35++
                }

                if (corOlhos === 2 && corCabelos === 1) {
                    qtdVerdeLouros++
                }
                
                etapa = 0
                instruction.textContent = 'Informe a idade (ou -1 para encerrar):'
                resultado.innerHTML = '<span style="color: green;">Habitante cadastrado!</span>'
                
                cabelosSelect.remove()
                valorInput.style.display = 'block'
                valorInput.value = ''
                valorInput.focus()
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
