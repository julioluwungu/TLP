<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas dos Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Estatísticas dos Alunos</h1>
    
    <div class="instruction" id="instruction">Informe a idade do aluno 1:</div>
    
    <input type="number" id="valor-input" placeholder="Digite o valor">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let totalAlunos = 45
        let idades = []
        let alturas = []
        let alunoAtual = 0
        let etapa = 0
        let idadeAtual
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                const idade = parseInt(valorInput.value)
                
                if (isNaN(idade) || idade <= 0) {
                    resultado.innerHTML = '<span style="color: red;">Idade inválida!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                idadeAtual = idade
                etapa = 1
                instruction.textContent = `Informe a altura do aluno ${alunoAtual + 1} em metros:`
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 1) {
                const altura = parseFloat(valorInput.value)
                
                if (isNaN(altura) || altura <= 0) {
                    resultado.innerHTML = '<span style="color: red;">Altura inválida!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                if (altura < 1.70) {
                    idades.push(idadeAtual)
                }

                if (idadeAtual > 20) {
                    alturas.push(altura)
                }
                
                alunoAtual++
                
                if (alunoAtual < totalAlunos) {
                    etapa = 0
                    instruction.textContent = `Informe a idade do aluno ${alunoAtual + 1}:`
                    resultado.innerHTML = `<span style="color: green;">Aluno ${alunoAtual} cadastrado!</span>`
                    valorInput.value = ''
                    valorInput.focus()
                } else {
                    let somaIdade = idades.reduce((ac, valor) => ac + valor, 0)
                    let somaAltura = alturas.reduce((ac, valor) => ac + valor, 0)

                    let idadeMedia = idades.length > 0 ? somaIdade / idades.length : 0
                    let alturaMedia = alturas.length > 0 ? somaAltura / alturas.length : 0

                    resultado.innerHTML = `
                        <div style="color: blue; font-weight: bold;">A idade média dos alunos com menos de 1,70 m é: ${idadeMedia.toFixed(1)} anos</div>
                        <div style="color: blue; font-weight: bold;">A altura média dos alunos com mais de 20 anos é: ${alturaMedia.toFixed(1)} metros</div>
                    `
                    
                    document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                    document.querySelector('#proximo-btn').addEventListener('click', function() {
                        idades = []
                        alturas = []
                        alunoAtual = 0
                        etapa = 0
                        instruction.textContent = 'Informe a idade do aluno 1:'
                        resultado.innerHTML = ''
                        valorInput.value = ''
                        valorInput.focus()
                        this.textContent = 'Próximo'
                    }, { once: true })
                }
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
