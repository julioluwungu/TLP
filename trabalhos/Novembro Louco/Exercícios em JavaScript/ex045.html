<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Pares e Ímpares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Contador de Pares e Ímpares</h1>
    
    <div class="instruction" id="instruction">Digite o 1º número (9999 para encerrar):</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let numeros = []
        let contador = 1
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const numero = parseInt(valorInput.value)
            
            if (numero === 9999) {
                if (numeros.length === 0) {
                    resultado.innerHTML = '<span style="color: red;">Nenhum número foi digitado!</span>'
                    return
                }
                
                let pares = numeros.filter(num => num % 2 === 0)
                let impares = numeros.filter(num => num % 2 !== 0)

                resultado.innerHTML = `
                    <div style="color: blue; font-weight: bold;">Quantidade de números pares: ${pares.length}</div>
                    <div style="color: blue; font-weight: bold;">Quantidade de números ímpares: ${impares.length}</div>
                `
                
                document.querySelector('#proximo-btn').textContent = 'Contar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    numeros = []
                    contador = 1
                    instruction.textContent = 'Digite o 1º número (9999 para encerrar):'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            } else if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido.</span>'
                valorInput.value = ''
                valorInput.focus()
            } else {
                numeros.push(numero)
                contador++
                instruction.textContent = `Digite o ${contador}º número (9999 para encerrar):`
                resultado.innerHTML = `<span style="color: green;">Número ${numero} adicionado. Total: ${numeros.length}</span>`
                valorInput.value = ''
                valorInput.focus()
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
