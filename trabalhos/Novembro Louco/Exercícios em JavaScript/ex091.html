<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Número Triangular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Verificador de Número Triangular</h1>
    
    <div class="instruction">Digite um número:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número">
    
    <button id="verificar-btn">Verificar</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#verificar-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numero = Number(numeroInput.value)

            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let triangular = false
            let resultadoHTML = ''

            for (let x = 1; x < Math.cbrt(numero) + 1; x++) {
                let produto = x * (x + 1) * (x + 2)
                if (produto === numero) {
                    triangular = true
                    resultadoHTML = `<span style="color: green; font-weight: bold;">O número ${numero} é um número triangular: ${x} x ${x + 1} x ${x + 2} = ${produto}</span>`
                    break
                }
            }

            if (!triangular) {
                resultadoHTML = `<span style="color: red; font-weight: bold;">O número ${numero} não é um número triangular.</span>`
            }

            resultado.innerHTML = resultadoHTML

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#verificar-btn').click()
            }
        })
    </script>
</body>
</html>
