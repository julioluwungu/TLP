<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fatorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Fatorial</h1>
    
    <div class="instruction">Digite um número para calcular o fatorial:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número inteiro">
    
    <button id="calcular-btn">Calcular Fatorial</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numero = parseInt(numeroInput.value)

            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um valor inteiro válido.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }
            
            if (numero < 0) {
                resultado.innerHTML = '<span style="color: red;">Fatorial não é definido para números negativos.</span>'
                numeroInput.value = ''
                numeroInput.focus()
            } else {
                let fatorial = 1

                for (let c = 1; c <= numero; c++) {
                    fatorial *= c
                }

                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O fatorial de ${numero} é: ${fatorial}</span>`

                numeroInput.value = ''
                numeroInput.focus()
            }
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#calcular-btn').click()
            }
        })
    </script>
</body>
</html>
