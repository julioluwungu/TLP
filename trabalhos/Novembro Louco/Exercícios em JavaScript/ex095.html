<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }

        .resultado {
            margin-top: 20px;
            font-size: 48px;
            font-weight: bold;
            color: blue;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>

<body>
    <h1>Relógio Digital</h1>

    <div class="instruction">Clique no botão para iniciar o relógio:</div>

    <button id="iniciar-btn">Iniciar Relógio</button>

    <div class="resultado" id="resultado"></div>

    <script>
        let intervalo

        function atualizarHora() {
            let agora = new Date()
            let horas = String(agora.getHours()).padStart(2, '0')
            let minutos = String(agora.getMinutes()).padStart(2, '0')
            let segundos = String(agora.getSeconds()).padStart(2, '0')

            let horaFormatada = `${horas}:${minutos}:${segundos}`
            document.querySelector('#resultado').textContent = horaFormatada
        }

        document.querySelector('#iniciar-btn').addEventListener('click', function () {
            if (this.textContent == 'Parar Relógio') {
                clearInterval(intervalo)
                this.textContent = 'Iniciar Relógio'
            } else {
                atualizarHora()
                intervalo = setInterval(atualizarHora, 1000)

                this.textContent = 'Parar Relógio'
            }
        })
    </script>
</body>

</html>
