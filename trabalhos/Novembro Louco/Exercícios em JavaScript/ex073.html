<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Sobrenome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Extrator de Sobrenome</h1>
    
    <div class="instruction">Digite seu nome completo:</div>
    
    <input type="text" id="nome-input" placeholder="Digite seu nome completo">
    
    <button id="extrair-btn">Extrair Sobrenome</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#extrair-btn').addEventListener('click', function() {
            const nomeInput = document.querySelector('#nome-input')
            const resultado = document.querySelector('#resultado')
            const nomeCompleto = nomeInput.value.trim()

            if (!nomeCompleto) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um nome!</span>'
                nomeInput.focus()
                return
            }

            let partes = nomeCompleto.trim().split(/\s+/)

            if (partes.length > 1) {
                let sobrenome = partes.at(-1)
                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">Sobrenome: ${sobrenome}</span>`
            } else {
                resultado.innerHTML = '<span style="color: red;">Sobrenome não encontrado. Certifique-se de digitar um nome completo.</span>'
            }

            nomeInput.value = ''
            nomeInput.focus()
        })

        document.querySelector('#nome-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#extrair-btn').click()
            }
        })
    </script>
</body>
</html>
