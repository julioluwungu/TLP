<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número por Extenso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Número por Extenso</h1>
    
    <div class="instruction">Digite um número entre 20 e 99:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número entre 20 e 99" min="20" max="99">
    
    <button id="converter-btn">Converter</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#converter-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numero = parseInt(numeroInput.value)

            if (numero < 20 || numero > 99 || isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Número inválido. Por favor, digite um número entre 20 e 99.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove']
            let dezenas = ['', 'dez', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa']
            let extenso = ''

            if (numero < 30) {
                extenso = dezenas[2] + (numero === 20 ? '' : ' e ' + unidades[numero % 10])
            } else {
                extenso = dezenas[Math.floor(numero / 10)] +
                    (numero % 10 !== 0 ? ' e ' + unidades[numero % 10] : '')
            }

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O número ${numero} por extenso é: ${extenso}</span>`

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#converter-btn').click()
            }
        })
    </script>
</body>
</html>
