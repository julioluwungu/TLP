<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container {
            border: 2px solid black;
        }

        li p {
            color: red;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <ul>
            <li>Item 1</li>
            <li>
                Item 2
                <p>Este parágrafo está dentro de um item de lista.</p>
            </li>
            <li>Item 3</li>
        </ul>
    </div>
</body>
</html>
