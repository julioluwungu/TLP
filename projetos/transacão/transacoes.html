<!-- index.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tela de Transações</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Tela de Transações</h1>
        <p class="lead">Visualize entradas e saídas com detalhes rápidos.</p>
      </div>
      <div class="controls">
        <input class="search" id="search" placeholder="Pesquisar nome, valor ou data"/>
        <select id="filter" class="filter" aria-label="Filtrar tipo">
          <option value="all">Todos</option>
          <option value="in">Entradas</option>
          <option value="out">Saídas</option>
        </select>
      </div>
    </header>

    <section class="card">
      <div id="list" class="tx-list" role="list"></div>
      <div id="empty" class="empty" style="display:none">Nenhuma transação encontrada.</div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
