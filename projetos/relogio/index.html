<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Analógico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="relogio">
        <div class="time hora" date-hour-hand></div>
        <div class="time minuto"date-minute-hand></div>
        <div class="time segundo" date-second-hand></div>
        <div class="number n1"><span class="grau num1">1</span></div>
        <div class="number n2"><span class="grau num2">2</span></div>
        <div class="number n3"><span class="grau num3">3</span></div>
        <div class="number n4"><span class="grau num4">4</span></div>
        <div class="number n5"><span class="grau num5">5</span></div>
        <div class="number n6"><span class="grau num6">6</span></div>
        <div class="number n7"><span class="grau num7">7</span></div>
        <div class="number n8"><span class="grau num8">8</span></div>
        <div class="number n9"><span class="grau num9">9</span></div>
        <div class="number n10"><span class="grau num10">10</span></div>
        <div class="number n11"><span class="grau num11">11</span></div>
        <div class="number n12"><span class="grau num12">12</span></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
