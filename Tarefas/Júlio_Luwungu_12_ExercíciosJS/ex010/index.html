<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="login">
            <input type="email" id="email" placeholder="E-mail" minlength="10" maxlength="30" required>
            <input type="password" id="password" placeholder="Senha" minlength="8" maxlength="20" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="res"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
