<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome ao Contrário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Nome ao Contrário</h1>
    
    <div class="instruction">Digite seu nome:</div>
    
    <input type="text" id="nome-input" placeholder="Digite seu nome">
    
    <button id="inverter-btn">Inverter Nome</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#inverter-btn').addEventListener('click', function() {
            const nomeInput = document.querySelector('#nome-input')
            const resultado = document.querySelector('#resultado')
            const nome = nomeInput.value.trim()

            if (!nome) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um nome!</span>'
                nomeInput.focus()
                return
            }

            let nomeInvertido = nome.split('').reverse().join('').toUpperCase()

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">Seu nome ao contrário é: ${nomeInvertido}</span>`

            nomeInput.value = ''
            nomeInput.focus()
        })

        document.querySelector('#nome-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#inverter-btn').click()
            }
        })
    </script>
</body>
</html>
