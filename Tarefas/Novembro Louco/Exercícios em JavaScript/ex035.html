<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Multiplicação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Tabela de Multiplicação</h1>
    
    <div class="instruction">Digite um número para ver sua tabela de multiplicação:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número">
    
    <button id="gerar-btn">Gerar Tabela</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#gerar-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numero = parseInt(numeroInput.value)

            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um número válido!</span>'
                numeroInput.focus()
                return
            }

            let tabelaHTML = `<div style="font-weight: bold; margin-bottom: 10px;">Tabela de multiplicação de ${numero}:</div>`
            
            for (let c = 1; c <= 13; c++) {
                let resultadoCalc = numero * c
                tabelaHTML += `<div>${numero} x ${c} = ${resultadoCalc}</div>`
            }

            resultado.innerHTML = tabelaHTML

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#gerar-btn').click()
            }
        })
    </script>
</body>
</html>
