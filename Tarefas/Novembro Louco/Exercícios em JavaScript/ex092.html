<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de Pares e Primos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Soma de Pares e Primos</h1>
    
    <div class="instruction" id="instruction">Digite o 1º número:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        function ehPrimo(numero) {
            if (numero <= 1) return false
            for (let c = 2; c <= Math.sqrt(numero); c++) {
                if (numero % c === 0) return false
            }
            return true
        }

        let somaPares = 0
        let somaPrimos = 0
        let contador = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const numero = Number(numeroInput.value)

            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            if (numero % 2 === 0) {
                somaPares += numero
            }

            if (ehPrimo(numero)) {
                somaPrimos += numero
            }

            contador++

            if (contador < 10) {
                instruction.textContent = `Digite o ${contador + 1}º número:`
                resultado.innerHTML = `<span style="color: green;">Número ${contador} adicionado!</span>`
                numeroInput.value = ''
                numeroInput.focus()
            } else {
                resultado.innerHTML = `
                    <div style="color: blue; font-weight: bold;">Soma dos números pares: ${somaPares}</div>
                    <div style="color: blue; font-weight: bold;">Soma dos números primos: ${somaPrimos}</div>
                `
                
                document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    somaPares = 0
                    somaPrimos = 0
                    contador = 0
                    instruction.textContent = 'Digite o 1º número:'
                    resultado.innerHTML = ''
                    numeroInput.value = ''
                    numeroInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
