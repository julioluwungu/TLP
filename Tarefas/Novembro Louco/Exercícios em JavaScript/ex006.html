<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de Dígitos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Soma de Dígitos</h1>
    
    <div class="instruction">Digite uma sequência de números:</div>
    
    <input type="text" id="numeros-input" placeholder="Ex: 12345">
    
    <button id="calcular-btn">Calcular Soma</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            const numerosInput = document.querySelector('#numeros-input')
            const resultado = document.querySelector('#resultado')
            const numeros = numerosInput.value

            if (!/^\d+$/.test(numeros)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido!</span>'
                numerosInput.value = ''
                numerosInput.focus()
                return
            }

            let listaNum = Array.from(numeros, Number)
            let soma = listaNum.reduce((ac, valor) => ac + valor)

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">A soma dos números digitados é: ${soma}</span>`

            numerosInput.value = ''
            numerosInput.focus()
        })

        document.querySelector('#numeros-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#calcular-btn').click()
            }
        })
    </script>
</body>
</html>
