<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Nomes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Verificador de Nomes</h1>
    
    <div class="instruction" id="instruction">Digite o nome da pessoa 1:</div>
    
    <input type="text" id="nome-input" placeholder="Digite um nome">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let nomes = []
        let nomeAtual = 0
        let etapa = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const nomeInput = document.querySelector('#nome-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const nome = nomeInput.value.trim()
            
            if (!nome) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um nome!</span>'
                nomeInput.focus()
                return
            }
            
            if (etapa === 0) {
                nomes.push(nome)
                nomeAtual++
                
                if (nomeAtual < 10) {
                    instruction.textContent = `Digite o nome da pessoa ${nomeAtual + 1}:`
                    resultado.innerHTML = ''
                    nomeInput.value = ''
                    nomeInput.focus()
                } else {
                    etapa = 1
                    instruction.textContent = 'Digite um nome para verificar:'
                    resultado.innerHTML = ''
                    nomeInput.value = ''
                    nomeInput.focus()
                }
            } else {
                if (nomes.includes(nome)) {
                    resultado.innerHTML = '<span style="color: green; font-weight: bold;">ACHEI</span>'
                } else {
                    resultado.innerHTML = '<span style="color: red; font-weight: bold;">NÃO ACHEI</span>'
                }
                
                document.querySelector('#proximo-btn').textContent = 'Verificar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    nomes = []
                    nomeAtual = 0
                    etapa = 0
                    instruction.textContent = 'Digite o nome da pessoa 1:'
                    resultado.innerHTML = ''
                    nomeInput.value = ''
                    nomeInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#nome-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
