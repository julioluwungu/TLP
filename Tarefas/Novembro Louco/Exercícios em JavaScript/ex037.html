<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Números</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Análise de Números</h1>
    
    <div class="instruction" id="instruction">Digite o 1º número inteiro:</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número inteiro">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let numeros = []
        let numeroAtual = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const numero = parseInt(valorInput.value)
            
            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um valor inteiro válido.</span>'
                valorInput.value = ''
                valorInput.focus()
                return
            }
            
            numeros.push(numero)
            numeroAtual++
            
            if (numeroAtual < 10) {
                instruction.textContent = `Digite o ${numeroAtual + 1}º número inteiro:`
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
            } else {
                let soma = numeros.reduce((ac, valor) => ac + valor, 0)
                let media = soma / numeros.length
                let maior = Math.max(...numeros)
                let menor = Math.min(...numeros)

                resultado.innerHTML = `
                    <div style="color: blue; font-weight: bold;">Média: ${media.toFixed(1)}</div>
                    <div style="color: green; font-weight: bold;">Maior número: ${maior}</div>
                    <div style="color: red; font-weight: bold;">Menor número: ${menor}</div>
                `
                
                document.querySelector('#proximo-btn').textContent = 'Analisar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    numeros = []
                    numeroAtual = 0
                    instruction.textContent = 'Digite o 1º número inteiro:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
