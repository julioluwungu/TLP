<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substituidor de Texto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Substituidor de Texto</h1>
    
    <div class="instruction">Digite uma frase ou uma palavra qualquer:</div>
    
    <input type="text" id="texto-input" placeholder="Digite um texto">
    
    <button id="substituir-btn">Substituir</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#substituir-btn').addEventListener('click', function() {
            const textoInput = document.querySelector('#texto-input')
            const resultado = document.querySelector('#resultado')
            const texto = textoInput.value.trim()

            if (!texto) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um texto!</span>'
                textoInput.focus()
                return
            }

            let vetorTxt = texto.split(' ')
            let listaAsteriscos = vetorTxt.map(palavra => '*'.repeat(palavra.length))
            let textoAsteriscos = listaAsteriscos.join(' ')

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">Caracteres substituídos por asterisco: ${textoAsteriscos}</span>`

            textoInput.value = ''
            textoInput.focus()
        })

        document.querySelector('#texto-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#substituir-btn').click()
            }
        })
    </script>
</body>
</html>
