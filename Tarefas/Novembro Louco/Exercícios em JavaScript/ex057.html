<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maior Quadrado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Maior Quadrado</h1>
    
    <div class="instruction">Informe um número inteiro N:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número inteiro não negativo" min="0">
    
    <button id="calcular-btn">Calcular</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numN = parseInt(numeroInput.value)

            if (isNaN(numN) || numN < 0) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número inteiro não negativo.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let maiorQuadrado = (Math.floor(numN ** 0.5)) ** 2

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O maior quadrado menor ou igual a ${numN} é: ${maiorQuadrado}</span>`

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#calcular-btn').click()
            }
        })
    </script>
</body>
</html>
