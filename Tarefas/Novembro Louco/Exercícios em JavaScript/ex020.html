<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequência Numérica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Sequência Numérica</h1>
    
    <div class="instruction">Clique no botão para gerar a sequência:</div>
    
    <button id="gerar-btn">Gerar Sequência</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#gerar-btn').addEventListener('click', function() {
            let resultadoHTML = ''
            
            for (let i = 1; i <= 10; i++) {
                let sequencia = `${i}, `
                for (let j = 1; j <= 10; j++) {
                    sequencia += j
                    if (j < 10) {
                        sequencia += ' '
                    }
                }
                resultadoHTML += `<div>${sequencia}</div>`
            }
            
            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = resultadoHTML
        })
    </script>
</body>
</html>
