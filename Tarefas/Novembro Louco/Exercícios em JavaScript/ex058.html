<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequência de Fibonacci</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Sequência de Fibonacci</h1>
    
    <div class="instruction">Informe um número inteiro N (N >= 2):</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número maior ou igual a 2" min="2">
    
    <button id="calcular-btn">Gerar Sequência</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numN = parseInt(numeroInput.value)

            if (isNaN(numN) || numN < 2) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número inteiro maior ou igual a 2.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let fibonacci = [0, 1]

            for (let c = 2; c < numN; c++) {
                let proximoTermo = fibonacci[c - 1] + fibonacci[c - 2]
                fibonacci.push(proximoTermo)
            }

            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">Os ${numN} primeiros termos da sequência de Fibonacci são: ${fibonacci.join(", ")}</span>`

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#calcular-btn').click()
            }
        })
    </script>
</body>
</html>
