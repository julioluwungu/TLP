<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de String</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Analisador de String</h1>
    
    <div class="instruction">Digite uma string:</div>
    
    <input type="text" id="texto-input" placeholder="Digite um texto">
    
    <button id="analisar-btn">Analisar String</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#analisar-btn').addEventListener('click', function() {
            const textoInput = document.querySelector('#texto-input')
            const resultado = document.querySelector('#resultado')
            const texto = textoInput.value.trim().toLowerCase()

            if (!texto) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um texto!</span>'
                textoInput.focus()
                return
            }

            let listaTxt = Array.from(texto)

            let digitos = listaTxt.filter(elemento => {
                let numero = Number(elemento)
                if (!isNaN(numero)) return elemento
            })
            let palindromo = texto === texto.split("").reverse().join("")
            const vogais = listaTxt.filter(elemento => 'aeiou'.includes(elemento))

            resultado.innerHTML = `
                <div>a) Número de caracteres: ${texto.length}</div>
                <div>b) String em maiúsculo: ${texto.toUpperCase()}</div>
                <div>c) Número de vogais: ${vogais.length}</div>
                <div>d) A string começa com "UNI": ${texto.toUpperCase().startsWith("UNI")}</div>
                <div>e) A string termina com "RIO": ${texto.toUpperCase().endsWith("RIO")}</div>
                <div>f) Número de dígitos: ${digitos.length}</div>
                <div>g) A string é um palíndromo: ${palindromo}</div>
            `

            textoInput.value = ''
            textoInput.focus()
        })

        document.querySelector('#texto-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#analisar-btn').click()
            }
        })
    </script>
</body>
</html>
