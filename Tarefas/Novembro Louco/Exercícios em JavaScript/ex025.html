<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Analisador de Números</h1>
    
    <div class="instruction" id="instruction">Digite um número (ou "sair" para encerrar):</div>
    
    <input type="text" id="valor-input" placeholder="Digite um número ou 'sair'">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let valores = []
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            const entrada = valorInput.value.trim()
            
            if (entrada.toLowerCase() === 'sair') {
                if (valores.length === 0) {
                    resultado.innerHTML = '<span style="color: red;">Nenhum número foi digitado!</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                let soma = valores.reduce((ac, valor) => ac + valor)
                let media = valores.length > 0 ? soma / valores.length : 0
                let positivos = valores.filter(num => num > 0)
                let negativos = valores.filter(num => num < 0)

                let percentualPositivo = (positivos.length * 100) / valores.length
                let percentualNegativo = (negativos.length * 100) / valores.length

                resultado.innerHTML = `
                    <div>Média Aritmética: ${media.toFixed(1)}</div>
                    <div>Quantidade de Valores Positivos: ${positivos.length}</div>
                    <div>Quantidade de Valores Negativos: ${negativos.length}</div>
                    <div>Percentual de Valores Positivos: ${percentualPositivo.toFixed(1)}%</div>
                    <div>Percentual de Valores Negativos: ${percentualNegativo.toFixed(1)}%</div>
                `
                
                document.querySelector('#proximo-btn').textContent = 'Analisar Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    valores = []
                    instruction.textContent = 'Digite um número (ou "sair" para encerrar):'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
                
            } else {
                let numero = parseFloat(entrada)
                
                if (isNaN(numero)) {
                    resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, insira um número</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                valores.push(numero)
                resultado.innerHTML = `<span style="color: green;">Número ${numero} adicionado. Total: ${valores.length}</span>`
                valorInput.value = ''
                valorInput.focus()
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
