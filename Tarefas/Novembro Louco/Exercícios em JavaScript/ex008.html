<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Especiais</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Números Especiais</h1>
    
    <div class="instruction">Clique no botão para encontrar os números de 4 dígitos que seguem a regra especial:</div>
    
    <button id="encontrar-btn">Encontrar Números</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#encontrar-btn').addEventListener('click', function() {
            let valores = []

            for (let num = 1000; num <= 9999; num++) {
                let strnum = num.toString()
                let parte1 = Number(strnum[0] + strnum[1])
                let parte2 = Number(strnum[2] + strnum[3])
                let resultado = (parte1 + parte2) ** 2
                if (resultado == num) valores.push(num)
            }

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">Os números que seguem a regra são:</div>
                <div>${valores.join(', ')}</div>
            `
        })
    </script>
</body>
</html>
