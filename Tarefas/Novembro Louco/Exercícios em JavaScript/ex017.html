<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Números Primos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Verificador de Números Primos</h1>
    
    <div class="instruction">Digite um número inteiro N:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número inteiro" min="1">
    
    <button id="verificar-btn">Verificar Primos</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        function ehPrimo(num) {
            if (num < 2) {
                return { primo: false, divisao: 0 }
            }
            let qtdDivisoes = 0

            for (let i = 2; i <= Math.sqrt(num); i++) {
                qtdDivisoes++
                if (num % i === 0) {
                    return { primo: false, divisao: qtdDivisoes }
                }
            }
            return { primo: true, divisao: qtdDivisoes }
        }

        document.querySelector('#verificar-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numN = parseInt(numeroInput.value)

            if (isNaN(numN)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido!</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let totalDivisoes = 0
            let numerosPrimos = []

            for (let i = 1; i <= numN; i++) {
                let resultadoPrimo = ehPrimo(i)
                totalDivisoes += resultadoPrimo.divisao
                if (resultadoPrimo.primo) {
                    numerosPrimos.push(i)
                }
            }

            resultado.innerHTML = `
                <div style="margin-bottom: 10px;">Números primos entre 1 e ${numN}: ${numerosPrimos.join(", ")}</div>
                <div style="color: blue; font-weight: bold;">Total de divisões executadas: ${totalDivisoes}</div>
            `

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#verificar-btn').click()
            }
        })
    </script>
</body>
</html>
