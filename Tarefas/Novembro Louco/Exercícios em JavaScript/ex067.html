<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplos de 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Múltiplos de 5</h1>
    
    <div class="instruction">Clique no botão para calcular os múltiplos de 5 entre 1 e 10.000:</div>
    
    <button id="calcular-btn">Calcular</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            let multiplos5 = []
            let fim = 10000

            for (let num = 1; num <= fim; num++) {
                if (num % 5 === 0) multiplos5.push(num)
            }

            let percentual5 = (multiplos5.length * 100) / fim

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `
                <div style="color: blue; font-weight: bold;">No intervalo de 1 à 10.000 foram encontrados ${multiplos5.length} múltiplos de 5.</div>
                <div style="color: blue; font-weight: bold;">O percentual de 5 é de ${percentual5.toFixed(1)}%</div>
            `
        })
    </script>
</body>
</html>
