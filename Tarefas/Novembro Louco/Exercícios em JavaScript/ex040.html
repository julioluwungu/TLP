<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicação por Soma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Multiplicação por Soma</h1>
    
    <div class="instruction" id="instruction">Digite o primeiro número inteiro:</div>
    
    <input type="number" id="valor-input" placeholder="Digite um número inteiro">
    
    <button id="proximo-btn">Próximo</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        let numero1
        let numero2
        let etapa = 0
        
        document.querySelector('#proximo-btn').addEventListener('click', function() {
            const valorInput = document.querySelector('#valor-input')
            const resultado = document.querySelector('#resultado')
            const instruction = document.querySelector('#instruction')
            
            if (etapa === 0) {
                numero1 = parseInt(valorInput.value)
                
                if (isNaN(numero1)) {
                    resultado.innerHTML = '<span style="color: red;">Entrada inválida! Por favor, digite um número inteiro válido.</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                etapa = 1
                instruction.textContent = 'Digite o segundo número inteiro:'
                resultado.innerHTML = ''
                valorInput.value = ''
                valorInput.focus()
                
            } else if (etapa === 1) {
                numero2 = parseInt(valorInput.value)
                
                if (isNaN(numero2)) {
                    resultado.innerHTML = '<span style="color: red;">Entrada inválida! Por favor, digite um número inteiro válido.</span>'
                    valorInput.value = ''
                    valorInput.focus()
                    return
                }
                
                let resultadoCalc = 0

                for (let i = 0; i < Math.abs(numero2); i++) {
                    resultadoCalc += numero1
                }

                if (numero2 < 0) {
                    resultadoCalc = -resultadoCalc
                }

                resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O resultado da multiplicação de ${numero1} por ${numero2} é: ${resultadoCalc}</span>`
                
                document.querySelector('#proximo-btn').textContent = 'Calcular Novamente'
                document.querySelector('#proximo-btn').addEventListener('click', function() {
                    etapa = 0
                    instruction.textContent = 'Digite o primeiro número inteiro:'
                    resultado.innerHTML = ''
                    valorInput.value = ''
                    valorInput.focus()
                    this.textContent = 'Próximo'
                }, { once: true })
            }
        })

        document.querySelector('#valor-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#proximo-btn').click()
            }
        })
    </script>
</body>
</html>
