<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grãos de Trigo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Grãos de Trigo</h1>
    
    <div class="instruction">Clique no botão para calcular o total de grãos no tabuleiro de xadrez:</div>
    
    <button id="calcular-btn">Calcular Grãos</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            let graos = 0
            let total = 0

            for (let quadro = 1; quadro <= 64; quadro++) {
                if (quadro == 1) graos = 1
                else graos *= 2

                total += graos
            }

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O Monge recebeu um total de ${total} grãos.</span>`
        })
    </script>
</body>
</html>
