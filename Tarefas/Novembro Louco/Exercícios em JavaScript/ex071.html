<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Verificador de Palíndromo</h1>
    
    <div class="instruction">Digite uma sequência de caracteres:</div>
    
    <input type="text" id="texto-input" placeholder="Digite um texto">
    
    <button id="verificar-btn">Verificar</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#verificar-btn').addEventListener('click', function() {
            const textoInput = document.querySelector('#texto-input')
            const resultado = document.querySelector('#resultado')
            const texto = textoInput.value.trim()

            if (!texto) {
                resultado.innerHTML = '<span style="color: red;">Por favor, digite um texto!</span>'
                textoInput.focus()
                return
            }

            let textoLimpo = texto.replace(/[\W_]/g, '').toLowerCase()
            let palindromo = textoLimpo === textoLimpo.split('').reverse().join('')

            resultado.innerHTML = `
                <div style="color: blue; font-weight: bold;">Frase: ${texto}</div>
                <div style="color: ${palindromo ? 'green' : 'red'}; font-weight: bold;">É um palíndromo? ${palindromo ? 'Sim' : 'Não'}</div>
            `

            textoInput.value = ''
            textoInput.focus()
        })

        document.querySelector('#texto-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#verificar-btn').click()
            }
        })
    </script>
</body>
</html>
