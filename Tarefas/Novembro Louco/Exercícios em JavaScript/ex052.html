<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisões Sucessivas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Divisões Sucessivas</h1>
    
    <div class="instruction">Digite um número:</div>
    
    <input type="number" id="numero-input" placeholder="Digite um número" step="any">
    
    <button id="calcular-btn">Calcular Divisões</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            const numeroInput = document.querySelector('#numero-input')
            const resultado = document.querySelector('#resultado')
            const numero = parseFloat(numeroInput.value)

            if (isNaN(numero)) {
                resultado.innerHTML = '<span style="color: red;">Valor inválido! Por favor, digite um número válido.</span>'
                numeroInput.value = ''
                numeroInput.focus()
                return
            }

            let contagem = 0
            let resultadoDiv = numero

            while (resultadoDiv >= 1) {
                resultadoDiv /= 2
                contagem++
            }

            resultado.innerHTML = `
                <div style="color: blue; font-weight: bold;">O resultado da última divisão é: ${resultadoDiv}</div>
                <div style="color: blue; font-weight: bold;">Quantidade de divisões efetuadas: ${contagem}</div>
            `

            numeroInput.value = ''
            numeroInput.focus()
        })

        document.querySelector('#numero-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#calcular-btn').click()
            }
        })
    </script>
</body>
</html>
