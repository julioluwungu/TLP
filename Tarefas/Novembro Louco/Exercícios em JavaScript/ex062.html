<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto dos Ímpares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Produto dos Ímpares</h1>
    
    <div class="instruction">Clique no botão para calcular o produto dos números ímpares de 1 a 15:</div>
    
    <button id="calcular-btn">Calcular Produto</button>
    
    <div class="resultado" id="resultado"></div>

    <script>
        document.querySelector('#calcular-btn').addEventListener('click', function() {
            let produto = 1

            for (let c = 1; c <= 15; c++) {
                if (c % 2 !== 0) produto *= c
            }

            const resultado = document.querySelector('#resultado')
            resultado.innerHTML = `<span style="color: blue; font-weight: bold;">O produto dos inteiros ímpares de 1 a 15 é: ${produto}</span>`
        })
    </script>
</body>
</html>
