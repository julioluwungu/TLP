<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#">
        <input type="number" name="texto" id="texto">
        <input type="button" value="Verificar" min="1" onclick="verificar()">
        <div id="res"></div>
    </form>

    <script>
        function verificar() {
            let texto = document.querySelector('input#texto').value
            let numero = Number(texto)
            let res = document.querySelector('div#res')
            cont = 0
            for (let c = 1; c <= (parseInt(numero**(0.5)) + 1); c++) {
                if (numero % c == 0) {
                    cont += 1
                }
            }
            if (numero == 2 || cont < 2) {
                res.innerHTML = 'O número digitado é PRIMO!'
                res.style.color = 'green'
            }
            else {
                res.innerHTML = 'O número digitado não é PRIMO!'
                res.style.color = 'red'
            }
        }
    </script>
</body>
</html>
