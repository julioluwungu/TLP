<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="border:1px solid #000; width:100%; height:20px;">
        <div id="progresso" style="background:green;height:100%;width:0;"></div>
    </div>
    <p id="status">0%</p>
    <button onclick="iniciarDownload()">Baixar</button>
    <script>
        function iniciarDownload() {
            const barra = document.getElementById("progresso");
            const status = document.getElementById("status");
            let progresso = 0;

            const intervalo = setInterval(() => {
                let sorteado = Math.floor(Math.random() * 5)

                let txt = barra.style.width
                let valor = Number(txt.replace('%', ''))
                if (valor + sorteado > 100) progresso += (100 - valor)
                else progresso += sorteado

                barra.style.width = progresso + '%';  // Corrigido aqui
                status.textContent = progresso + '%'; // Corrigido aqui

                if (progresso == 100) {
                    clearInterval(intervalo);
                    status.textContent = "Download completo";
                }
            }, 200);
        }
    </script>
</body>

</html>
